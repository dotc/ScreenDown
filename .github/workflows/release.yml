name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tags must use vX.Y.Z, for example v0.4.0.' >&2
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build and test universal app
        env:
          ARCHS: x86_64 arm64
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./build.sh

      - name: Verify architectures and package
        run: |
          lipo build/ScreenDown.app/Contents/MacOS/ScreenDown -verify_arch x86_64 arm64
          lipo build/ScreenDown.app/Contents/Resources/ScreenDownHelper -verify_arch x86_64 arm64
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/ScreenDown.app/Contents/Info.plist)
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/ScreenDown.app "dist/ScreenDown-${version}-universal.zip"
          cd dist
          shasum -a 256 ./*.zip > SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ScreenDown-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ScreenDown-release
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "ScreenDown $TAG" --generate-notes
          fi
